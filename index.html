<head>

<title>Quadlume</title>

<style>
:root{
  color-scheme:dark;
  --ink:#0A0F1E;--ink-2:#121936;--board:#1B2347;--board-edge:#2A3466;--hole:#0E142B;
  --amber:#F6B73C;--amber-glow:rgba(246,183,60,.55);--coral:#FF6B7A;--coral-glow:rgba(255,107,122,.45);
  --good:#6FE0A8;--text:#E8ECF8;--muted:#8F98BD;--line:#253060;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{background:radial-gradient(120% 40% at 50% 0%,#141C3C 0%,var(--ink) 60%) var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}
.toprow{display:flex;align-items:center;gap:10px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1;margin:0 auto 0 0;letter-spacing:-.02em}
.toprow select{font:600 13px var(--body);color:var(--text);background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;max-width:104px}
.statline{display:flex;gap:14px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.statline b{color:var(--text)}

.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.chip.n4 i{background:var(--amber)}.chip.n5 i{background:var(--coral)}
.linkbtn{background:none;border:0;color:var(--muted);font:600 13px var(--body);cursor:pointer;padding:4px 0}
.task{display:flex;flex-direction:column;gap:6px}
.task h2{font-family:var(--display);font-weight:800;font-size:clamp(19px,5.6vw,24px);line-height:1.1;margin:0;text-wrap:balance}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--amber);box-sizing:border-box}
.pips i.used{background:var(--amber);box-shadow:0 0 8px var(--amber-glow)}
.pips span{margin-left:6px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.banner{border:1px solid var(--amber);border-radius:12px;padding:10px 12px;background:rgba(246,183,60,.08);font-size:14px}

.status{min-height:44px;display:flex;flex-direction:column;justify-content:center}
.status .main{font-family:var(--display);font-weight:500;font-size:15px}
.status.bad .main{color:var(--coral)}.status.ok .main{color:var(--good)}
.status .sub{color:var(--muted);font-size:13px}
.markers{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding-inline:9px;height:18px}
.markers span{display:flex;justify-content:center;align-items:flex-end;color:var(--amber);font-size:13px;visibility:hidden}
.markers span.on{visibility:visible;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.board{background:linear-gradient(180deg,var(--board),#161D3D);border:1px solid var(--board-edge);border-radius:18px;padding:9px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);touch-action:manipulation}
.board.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.col{display:grid;grid-template-rows:repeat(6,auto);gap:5px;border-radius:10px;padding:2px;background:none;border:0;margin:0;min-width:0;cursor:pointer}
.col:hover:not(:disabled),.col:focus-visible{background:rgba(255,255,255,.06)}
.col:disabled{cursor:default}
.cell{aspect-ratio:1;border-radius:50%;position:relative;background:var(--hole);box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
.disc{position:absolute;inset:6%;border-radius:50%}
.disc.p1{background:radial-gradient(circle at 35% 30%,#FFE2A0,var(--amber) 45%,#C9851A);box-shadow:0 0 12px var(--amber-glow)}
.disc.p2{background:radial-gradient(circle at 35% 30%,#FFC2C8,var(--coral) 45%,#C63A52);box-shadow:0 0 10px var(--coral-glow)}
.disc.drop{animation:fall .36s cubic-bezier(.55,0,.8,.4)}
@keyframes fall{from{transform:translateY(var(--fall))}}
.disc.win{outline:3px solid #fff;outline-offset:2px;animation:winp 1s ease-in-out infinite}
@keyframes winp{50%{outline-color:transparent}}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 15px var(--body);border-radius:12px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:var(--ink-2);color:var(--text);flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--amber);color:#2A1A00;border-color:transparent}
.btn.small{padding:9px 12px;font-size:14px;flex:none}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--ink-2);padding:16px;display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;color:var(--good)}
.resline{font-size:17px;font-weight:600}
.seq{font-size:22px;letter-spacing:2px}
.next{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.next b{color:var(--text);font-family:var(--display);font-weight:500}
label.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text]{width:100%;box-sizing:border-box;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px var(--body)}
.card{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(18,25,54,.6)}
.card b{display:block}.card p{font-size:13px;color:var(--muted)}
.card .grow{flex:1 1 180px}
.card.hi{border-style:solid;border-color:var(--amber)}
.x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}
.rules{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.rules h3{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--muted)}
.rules b{color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--ink);font-weight:600;padding:10px 16px;border-radius:999px;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="toprow">
      <h1>Quadlume</h1>
      <select id="lang" aria-label="Språk"></select>
    </div>
  </header>
  <div class="statline"><span>🔥 <b id="s-streak">0</b> <span data-t="streak"></span></span><span>🧩 <b id="s-total">0</b> <span data-t="total"></span></span></div>

  <div class="card hi" id="install" hidden>
    <div class="grow"><b data-t="inst_title"></b><p id="inst-text"></p></div>

  <div class="banner" id="chal-banner" hidden></div>

  <div class="meta">

    <div class="actions">
      <button class="btn primary" id="next" type="button" data-t="next_nut"></button>
      <button class="btn" id="challenge" type="button" data-t="challenge"></button>
    </div>
    <div><label class="k" for="name" data-t="name_label"></label>
      <input type="text" id="name" maxlength="20" data-tp="name_ph" autocomplete="nickname"></div>
    <div class="next" id="countdown" hidden><span data-t="next_in"></span> <b>00:00:00</b></div>
  </div>

  <div class="card" id="notif" hidden>
    <div class="grow"><b data-t="notif_title"></b><p id="notif-text"></p></div>
    <button class="btn small" id="notif-btn" type="button" data-t="notif_btn"></button>
  </div>

  <section class="rules">
    <h3 data-t="how_title"></h3>
    <ul><li data-th="how1"></li><li data-th="how2"></li><li data-th="how3"></li></ul>
  </section>
</div>

/* Løser for fire på rad-nøtter. Gul = 1 (spilleren), rød = 2. Rad 0 er nederst. */
const W=7,H=6;
function mkState(){return {g:Array.from({length:W},()=>Array(H).fill(0)),h:Array(W).fill(0)};}
function fromSeq(seq){const S=mkState();let p=1;for(const ch of seq){drop(S,+ch,p);p=3-p;}return S;}
function drop(S,c,p){const r=S.h[c];S.g[c][r]=p;S.h[c]=r+1;return r;}
function undo(S,c){S.h[c]--;S.g[c][S.h[c]]=0;}
function lineAt(S,c,r){
  const p=S.g[c][r];if(!p) return null;
  for(const [dc,dr] of [[1,0],[0,1],[1,1],[1,-1]]){
    const line=[[c,r]];
    for(const s of [1,-1]){let cc=c+dc*s,rr=r+dr*s;while(cc>=0&&cc<W&&rr>=0&&rr<H&&S.g[cc][rr]===p){line.push([cc,rr]);cc+=dc*s;rr+=dr*s;}}
    if(line.length>=4) return line;
  }
  return null;
}
function immWins(S,p){const out=[];for(let c=0;c<W;c++){if(S.h[c]>=H) continue;const r=drop(S,c,p);if(lineAt(S,c,r)) out.push(c);undo(S,c);}return out;}
/* Gul er i trekket: kan gul tvinge frem seier innen n egne trekk? */
function canWin(S,n){
  if(immWins(S,1).length) return true;
  if(n<=1) return false;
  const rw=immWins(S,2);
  if(rw.length>1) return false;
  for(let c=0;c<W;c++){
    if(S.h[c]>=H) continue;
    if(rw.length&&c!==rw[0]) continue;
    drop(S,c,1);const ok=redAllLose(S,n-1);undo(S,c);
    if(ok) return true;
  }
  return false;
}
/* Rød er i trekket: vinner gul innen n egne trekk uansett hva rød gjør? */
function redAllLose(S,n){
  if(immWins(S,2).length) return false;
  const yt=immWins(S,1);
  if(yt.length>=2) return n>=1;
  let any=false;
  for(let c=0;c<W;c++){
    if(S.h[c]>=H) continue;
    if(yt.length===1&&c!==yt[0]) continue;
    any=true;
    drop(S,c,2);const ok=canWin(S,n);undo(S,c);
    if(!ok) return false;
  }
  return any;
}
/* Hvilke trekk for gul holder seieren innen n trekk? */
function winningMoves(S,n){
  const out=[];
  for(let c=0;c<W;c++){
    if(S.h[c]>=H) continue;
    const r=drop(S,c,1);
    const ok=!!lineAt(S,c,r)||(n>1&&redAllLose(S,n-1));
    undo(S,c);
    if(ok) out.push(c);
  }
  return out;
}
function minWin(S,max){for(let n=1;n<=max;n++) if(canWin(S,n)) return n;return 0;}
/* Rødts beste forsvar: vinn selv, ellers avverg, ellers hold ut lengst mulig. n = trekk gul har igjen. */
function redReply(S,n){
  let best=-1,bs=-1e9;
  for(let c=0;c<W;c++){
    if(S.h[c]>=H) continue;
    const r=drop(S,c,2);let s;
    if(lineAt(S,c,r)) s=1000;
    else{const m=n>0?minWin(S,n):0;s=m===0?500:m*10;}
    undo(S,c);
    s-=Math.abs(c-3)*0.1;
    if(s>bs){bs=s;best=c;}
  }
  return best;
}

const APP_NAME='Quadlume',BASE_URL='https://quadlume.com/nott/';
const LAUNCH=Date.UTC(2026,8,1);
const $=id=>document.getElementById(id);
const EMBEDDED=(()=>{try{return window.top!==window.self;}catch(e){return true;}})();

/* ---------- lagring og språk ---------- */
let store={v:2,lang:null,name:'',daily:{},cur:null,extra:0,notif:false,instX:0};
try{const s=JSON.parse(localStorage.getItem('qn-v1')||'null');if(s&&typeof s==='object'){const old=(s.v||1)<2;store=Object.assign(store,s);if(old){store.v=2;store.cur=null;store.base=(store.base||0)+(store.extra||0);store.extra=0;store.fresh=true;}}}catch(e){}
function save(){try{localStorage.setItem('qn-v1',JSON.stringify(store));}catch(e){}}
function detectLang(){
  const list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
  for(const l of list){const b=String(l).toLowerCase().split('-')[0];if(b==='nb'||b==='nn'||b==='no') return 'nb';if(I18N[b]) return b;}
  return 'en';
}
let lang=store.lang&&I18N[store.lang]?store.lang:detectLang();
function t(k,p){let s=(I18N[lang]&&I18N[lang][k]!=null)?I18N[lang][k]:(I18N.en[k]!=null?I18N.en[k]:k);if(p) s=s.replace(/\{(\w+)\}/g,(m,x)=>p[x]!=null?p[x]:m);return s;}
function locale(){return LOCALES[lang]||'en-GB';}
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  document.querySelectorAll('[data-th]').forEach(el=>{el.innerHTML=t(el.dataset.th);});
  document.querySelectorAll('[data-tp]').forEach(el=>{el.placeholder=t(el.dataset.tp);});
  document.querySelectorAll('[data-ta]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ta));});
  $('lang').setAttribute('aria-label',t('language'));
}
const sel=$('lang');
LANGS.forEach(([c,n])=>{const o=document.createElement('option');o.value=c;o.textContent=n;sel.appendChild(o);});
sel.value=lang;
sel.addEventListener('change',()=>{lang=sel.value;store.lang=lang;save();applyStatic();render();writeState();});

/* ---------- hvilke nøtter ---------- */
function todayIdx(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-LAUNCH)/864e5)+1;}
function weekdayOf(d){return (new Date(LAUNCH+(d-1)*864e5).getUTCDay()+6)%7;} /* mandag = 0 */
function dailySpec(d){
  const m=weekdayOf(d),week=Math.floor((d-1+weekdayOf(1))/7);
  let N,idx;
  if(m<2){N=3;idx=week*2+m;}else if(m<5){N=4;idx=week*3+(m-2);}else{N=5;idx=week*2+(m-5);}
  const pool=PUZZLES['d'+N];return {seq:pool[idx%pool.length],N};
}
function ladderSpec(i){
  const cnt={3:0,4:0,5:0};let N=3;
  for(let k=0;k<=i;k++){N=k<4?3:k<14?4:((k-14)%3===2?5:4);if(k<i) cnt[N]++;}
  const pool=PUZZLES['l'+N];return {seq:pool[cnt[N]%pool.length],N};
}

/* ---------- spilltilstand ---------- */
let mode=null,game=null;
function modeKey(m){return m.kind==='daily'?'d'+m.day:m.kind==='extra'?'x'+m.idx:'c'+m.src.t+m.src.id;}
function specFor(m){
  if(m.kind==='daily') return dailySpec(m.day);
  if(m.kind==='extra') return ladderSpec(m.idx);
  return m.src.t==='d'?dailySpec(m.src.id):ladderSpec(m.src.id);
}
function open(m){
  mode=m;const spec=specFor(m),key=modeKey(m);
  const cur=store.cur&&store.cur.key===key?store.cur:null;
  game={spec,S:fromSeq(spec.seq),n:spec.N,used:0,fails:cur?cur.fails:0,hint:cur?(+cur.hint||0):0,hf:cur?(cur.hf||0):0,phase:'play',winLine:null,dropAnim:null,msg:'start'};
  if(m.kind==='daily'&&store.daily[m.day]){const r=store.daily[m.day];game.fails=r.a-1;game.hint=r.h?1:0;game.phase='done';game.msg='before';}
  render();
}
function saveCur(){store.cur={key:modeKey(mode),fails:game.fails,hint:game.hint,hf:game.hf};save();}
function reset(){const g=game;g.S=fromSeq(g.spec.seq);g.n=g.spec.N;g.used=0;g.winLine=null;g.dropAnim=null;g.phase='play';g.msg=g.hint?'hint':'start';render();}

function tap(c){
  const g=game;if(!g||g.phase!=='play'||g.S.h[c]>=H) return;
  const good=winningMoves(g.S,g.n).includes(c);
  const r=drop(g.S,c,1);g.dropAnim={c,r};g.used++;
  if(good){
    const line=lineAt(g.S,c,r);
    if(line){g.winLine=line;return finish();}
    g.n--;g.phase='busy';g.msg='good';render();
    setTimeout(()=>{if(game!==g) return;const rc=redReply(g.S,g.n);const rr=drop(g.S,rc,2);g.dropAnim={c:rc,r:rr};g.phase='play';g.msg='next';render();},650);
  }else{
    g.phase='busy';g.msg='wrong';render();
    setTimeout(()=>{
      if(game!==g) return;
      const rc=redReply(g.S,Math.max(1,g.n-1));
      if(rc>=0){const rr=drop(g.S,rc,2);g.dropAnim={c:rc,r:rr};const l=lineAt(g.S,rc,rr);if(l) g.winLine=l;}
      g.fails++;saveCur();g.phase='wrong';render();
      const b=$('board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    },650);
  }
}
function finish(){
  const g=game;g.phase='done';g.msg='done';
  const a=g.fails+1,h=g.hint?1:0,today=todayIdx();
  if(mode.kind==='daily'){if(!store.daily[mode.day]) store.daily[mode.day]={a,h};}
  else if(mode.kind==='extra'){store.extra=Math.max(store.extra,mode.idx+1);}
  store.cur=null;save();render();updateBadge();writeState();
}
$('retry').addEventListener('click',reset);
$('hint').addEventListener('click',()=>{game.hint++;game.hf=game.fails;saveCur();reset();});

/* ---------- resultat ---------- */
function resText(a,h){return h?t('res_hint'):a===1?t('res_1'):t('res_n',{n:a});}
function lcFirst(s){return s.charAt(0).toLowerCase()+s.slice(1);}
function rankOf(a,h){return h?99:a;}
function streak(){const td=todayIdx();let d=store.daily[td]?td:td-1,n=0;while(store.daily[d]){n++;d--;}return n;}
function totalSolved(){return Object.keys(store.daily).length+store.extra+(store.base||0);}

/* ---------- visning ---------- */
function render(){
  const g=game,N=g.spec.N,S=g.S;
  $('s-streak').textContent=streak();$('s-total').textContent=totalSolved();
  const chip=$('chip');chip.className='chip n'+N;
  $('chip-text').textContent=(mode.kind==='daily'?t('daily_no',{n:mode.day}):mode.kind==='extra'?t('extra_no',{n:mode.idx+1}):t('chal_no'))+' · '+t('diff_'+N);
  $('back-daily').hidden=mode.kind==='daily';
  $('task').textContent=t('task',{n:N});
  const pips=$('pips');pips.innerHTML='';
  for(let i=0;i<N;i++){const p=document.createElement('i');if(i<g.used) p.className='used';pips.appendChild(p);}
  if(g.phase!=='done'){const sp=document.createElement('span');sp.textContent=t('moves',{a:Math.min(g.used+1,N),n:N});pips.appendChild(sp);}

  const opp=mode.opp,bn=$('chal-banner');
  bn.hidden=!opp||g.phase==='done';
  if(opp) bn.textContent=t('chal_from',{o:opp.name,r:lcFirst(resText(opp.a,opp.h))});

  const winSet=new Set((g.winLine||[]).map(([c,r])=>c+','+r));
  const bd=$('board');bd.innerHTML='';
  const can=g.phase==='play';
  for(let c=0;c<W;c++){
    const col=document.createElement('button');col.type='button';col.className='col';col.disabled=!can||S.h[c]>=H;
    col.setAttribute('aria-label',t('col_aria',{c:c+1}));
    col.addEventListener('click',()=>tap(c));
    for(let r=H-1;r>=0;r--){
      const cell=document.createElement('div');cell.className='cell';
      const v=S.g[c][r];
      if(v){const d=document.createElement('div');d.className='disc p'+v;
        if(g.dropAnim&&g.dropAnim.c===c&&g.dropAnim.r===r){d.classList.add('drop');d.style.setProperty('--fall',`-${(H-r)*110}%`);}
        if(winSet.has(c+','+r)) d.classList.add('win');
        cell.appendChild(d);}
      col.appendChild(cell);
    }
    bd.appendChild(col);
  }
  g.dropAnim=null;
  const mk=$('markers');mk.innerHTML='';
  const key=(g.hint>g.used&&g.phase==='play')?winningMoves(S,g.n)[0]:-1;
  for(let c=0;c<W;c++){const s=document.createElement('span');s.textContent='▼';if(c===key) s.className='on';mk.appendChild(s);}

  const st=$('status');let main='',sub='',cls='';
  if(g.msg==='start'){main=t('st_start');}
  else if(g.msg==='hint'){main=t('st_start');sub=t('st_hint');}
  else if(g.msg==='good'){main=t('st_good');cls='ok';}
  else if(g.msg==='next'){main=t('st_next');cls='ok';}
  else if(g.msg==='wrong'){main=t('st_wrong');sub=t('st_wrong_sub',{n:N});cls='bad';}
  else if(g.msg==='done'){main=t('st_done');cls='ok';}
  else if(g.msg==='before'){main=t('st_solved_before');}
  st.className='status '+cls;$('st-main').textContent=main;$('st-sub').textContent=sub;

  $('wrong-actions').hidden=g.phase!=='wrong';
  $('hint').hidden=!(g.fails-g.hf>=3&&g.hint<N-1);

  const done=g.phase==='done';$('result').hidden=!done;
  if(done){
    const a=g.fails+1,h=g.hint;
    $('res-line').textContent=resText(a,h);
    $('res-seq').textContent='🟥'.repeat(Math.min(g.fails,8))+(h?'💡':'')+'🟩';
    const cmp=$('res-cmp');cmp.hidden=!opp;
    if(opp){const me=rankOf(a,h),ot=rankOf(opp.a,opp.h);cmp.textContent=t(me<ot?'cmp_win':me>ot?'cmp_loss':'cmp_tie',{o:opp.name})+' ('+opp.name+': '+lcFirst(resText(opp.a,opp.h))+')';}
    $('name').value=store.name||'';
    $('countdown').hidden=!(mode.kind==='daily'&&mode.day===todayIdx());
  }
  renderCards();
}
$('back-daily').addEventListener('click',()=>open({kind:'daily',day:todayIdx()}));
$('next').addEventListener('click',()=>open({kind:'extra',idx:mode.kind==='extra'?mode.idx+1:store.extra}));
$('name').addEventListener('input',e=>{store.name=e.target.value.slice(0,20);save();});

/* ---------- utfordring ---------- */
function toast(msg){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}
function challengeLink(){
  const src=mode.kind==='daily'?['d',mode.day]:mode.kind==='extra'?['x',mode.idx]:[mode.src.t,mode.src.id];
  const name=((store.name||'').trim()||t('friend')).replace(/[.\s]+/g,'_').slice(0,20);
  return BASE_URL+'#c.'+src[0]+'.'+src[1]+'.'+(game.fails+1)+'.'+(game.hint?1:0)+'.'+encodeURIComponent(name);
}
$('challenge').addEventListener('click',async()=>{
  const msg=t('share_msg',{r:lcFirst(resText(game.fails+1,game.hint))}),url=challengeLink();
  if(navigator.share){try{await navigator.share({title:APP_NAME,text:msg,url});return;}catch(e){if(e&&e.name==='AbortError') return;}}
  try{await navigator.clipboard.writeText(msg+'\n'+url);toast(t('copied'));}catch(e){toast(url);}
});
let viaChallenge=false;
function parseHash(){
  let raw=(location.hash||'').slice(1);if(!raw) return null;
  try{raw=decodeURIComponent(raw);}catch(e){}
  const m=/^c\.(d|x)\.(\d+)\.(\d+)\.(0|1)\.(.+)$/.exec(raw);if(!m) return null;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  const id=+m[2],opp={name:m[5].replace(/_/g,' ').slice(0,20),a:Math.max(1,+m[3]),h:+m[4]===1};
  if(m[1]==='d'){const td=todayIdx();if(id>td||id<1) return null;if(id===td) return {kind:'daily',day:td,opp};}
  return {kind:'chal',src:{t:m[1],id},opp};
}
window.addEventListener('hashchange',()=>{const m=parseHash();if(m){viaChallenge=true;open(m);}});

/* ---------- installering ---------- */
let deferred=null;
function standalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent||'');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;renderCards();});
window.addEventListener('appinstalled',()=>{deferred=null;renderCards();});
$('inst-btn').addEventListener('click',async()=>{if(!deferred) return;deferred.prompt();try{await deferred.userChoice;}catch(e){}deferred=null;renderCards();});
$('inst-x').addEventListener('click',()=>{store.instX=todayIdx();save();renderCards();});
function renderCards(){
  const td=todayIdx(),any=totalSolved()>0;
  const showInst=!EMBEDDED&&!standalone()&&(viaChallenge||(store.instX!==td&&(any||deferred)));
  $('install').hidden=!showInst;
  if(showInst){$('inst-btn').hidden=!deferred;$('inst-text').textContent=deferred?t('inst_text'):IOS?t('inst_ios'):t('inst_other');}
  const showNotif=!EMBEDDED&&any&&game&&game.phase==='done'&&!(store.notif&&('Notification' in window)&&Notification.permission==='granted');
  $('notif').hidden=!showNotif&&!notifMsg;
  if(showNotif||notifMsg){$('notif-text').textContent=notifMsg||t('notif_text');$('notif-btn').hidden=!!notifMsg&&store.notif;}
}

/* ---------- varsel og merke på app-ikonet ----------
   Uten egen server er dette «beste forsøk»: nettleseren vekker appen i bakgrunnen (periodic background sync)
   og den viser varselet selv. Pålitelig levering hver dag krever en push-tjeneste. */
let notifMsg='';
async function writeState(){
  if(!('caches' in window)) return;
  try{
    const c=await caches.open('qn-state');let old={};const r=await c.match('state');if(r) old=await r.json();
    const days=Object.keys(store.daily).map(Number);
    const s={notif:!!store.notif,lastSolved:days.length?Math.max(...days):0,launch:LAUNCH,title:t('push_title'),body:t('push_body'),lastNotified:old.lastNotified||0};
    await c.put('state',new Response(JSON.stringify(s),{headers:{'Content-Type':'application/json'}}));
  }catch(e){}
}
async function updateBadge(){
  const unsolved=!store.daily[todayIdx()];
  try{if(navigator.setAppBadge){if(unsolved) await navigator.setAppBadge(1);else await navigator.clearAppBadge();}}catch(e){}
  if(!unsolved&&'serviceWorker' in navigator){try{const reg=await navigator.serviceWorker.getRegistration();if(reg&&reg.getNotifications){(await reg.getNotifications({tag:'daily'})).forEach(n=>n.close());}}catch(e){}}
}
$('notif-btn').addEventListener('click',async()=>{
  if(!('Notification' in window)||!('serviceWorker' in navigator)){notifMsg=t('notif_unsup');return renderCards();}
  let perm='denied';try{perm=await Notification.requestPermission();}catch(e){}
  if(perm!=='granted'){notifMsg=t('notif_denied');return renderCards();}
  store.notif=true;save();await writeState();
  try{const reg=await navigator.serviceWorker.ready;if('periodicSync' in reg) await reg.periodicSync.register('daily-nut',{minInterval:6*60*60*1000});}catch(e){}
  notifMsg=t('notif_on');renderCards();updateBadge();
});

/* ---------- klokke ---------- */
let shownDay=todayIdx();
function tick(){
  const now=new Date(),mid=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const s=Math.max(0,Math.floor((mid-now)/1000));
  const b=$('countdown').querySelector('b');
  if(b) b.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':');
  const td=todayIdx();
  if(td!==shownDay){shownDay=td;if(mode&&mode.kind==='daily') open({kind:'daily',day:td});updateBadge();}
}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();updateBadge();}});

/* ---------- start ---------- */
applyStatic();
const first=parseHash();
if(first) viaChallenge=true;
if(store.fresh){delete store.daily[todayIdx()];delete store.fresh;save();}
open(first||{kind:'daily',day:todayIdx()});
tick();updateBadge();writeState();

})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
