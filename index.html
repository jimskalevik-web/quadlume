<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quadlume</title>
<meta name="description" content="Four in a row in the dark, played like golf.">
<meta name="theme-color" content="#0A0F1E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quadlume">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#0A0F1E;
  --ink-2:#121936;
  --ink-3:#18204A;
  --board:#1B2347;
  --board-edge:#2A3466;
  --fog:#0C1124;
  --hole:#26315F;
  --amber:#F6B73C;
  --amber-glow:rgba(246,183,60,.55);
  --coral:#FF6B7A;
  --coral-glow:rgba(255,107,122,.5);
  --good:#6FE0A8;
  --text:#E8ECF8;
  --muted:#8F98BD;
  --line:#253060;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
html{background:var(--ink)}
body{
  background:radial-gradient(120% 40% at 50% 0%,#141C3C 0%,var(--ink) 60%) var(--ink);
  color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-inline:16px;padding-block:18px 40px;
}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.4vw,34px);line-height:1.04;margin:0;text-wrap:balance}
h1 .dim{color:transparent;-webkit-text-stroke:1.2px var(--muted)}
h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
p{margin:0}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{font:600 13px var(--body);color:var(--muted);background:none;border:0;border-radius:10px;padding:9px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--board-edge);color:var(--text)}
.view{display:flex;flex-direction:column;gap:14px}

.eyebrow{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:4px}
.nav button{background:var(--ink-2);border:1px solid var(--line);color:var(--text);border-radius:8px;width:32px;height:28px;cursor:pointer;font:600 14px var(--body)}
.nav button:disabled{opacity:.3;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text);background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:3px 10px;align-self:flex-start}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.chip.L i{background:var(--coral)}
.chip.M i{background:#9AA8FF}

.hud{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;background:var(--ink-2);overflow:hidden}
.hud>div{padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.hud>div+div{border-left:1px solid var(--line)}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud .v{font-family:var(--display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.hud .v small{font-size:13px;color:var(--muted)}
.matches{display:flex;gap:6px;align-items:center;height:30px}
.flame{width:10px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(180deg,#FFE3A1,var(--amber) 60%,#E0572E);flex:none}
.flame.used{background:#2A3160}

.status{min-height:46px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.status .main{font-family:var(--display);font-weight:500;font-size:16px}
.status .sub{color:var(--muted);font-size:14px}

.stage{position:relative}
.markers{display:grid;gap:4px;padding-inline:9px;height:20px;margin-bottom:4px}
.markers span{display:flex;justify-content:center;align-items:flex-end;font-size:13px;color:var(--coral);visibility:hidden}
.markers span.on{visibility:visible;animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{transform:translateY(4px);opacity:.5}}
.board{
  background:linear-gradient(180deg,var(--board) 0%,#161D3D 100%);
  border:1px solid var(--board-edge);border-radius:18px;padding:9px;
  display:grid;gap:4px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
  touch-action:manipulation;transition:box-shadow .2s;
}
.board.flash{box-shadow:0 0 0 2px var(--amber),0 0 50px -6px var(--amber-glow)}
.col{display:grid;gap:4px;border-radius:10px;padding:2px;cursor:pointer;background:none;border:0;margin:0;min-width:0}
.col:hover:not(:disabled),.col:focus-visible{background:rgba(255,255,255,.05)}
.col:disabled{cursor:default}
.cell{aspect-ratio:1;border-radius:50%;position:relative;max-width:100%}
.cell.fog,.cell.fogfill{background:var(--fog);box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.cell.fogfill::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1.5px dashed #3A4476}
.cell.lit{background:radial-gradient(circle at 50% 38%,#34417A 0%,var(--hole) 70%);box-shadow:inset 0 2px 5px rgba(0,0,0,.45)}
.disc{position:absolute;inset:6%;border-radius:50%}
.disc.p1{background:radial-gradient(circle at 35% 30%,#FFE2A0 0%,var(--amber) 45%,#C9851A 100%);box-shadow:0 0 14px var(--amber-glow)}
.disc.p2{background:radial-gradient(circle at 35% 30%,#FFC2C8 0%,var(--coral) 45%,#C63A52 100%);box-shadow:0 0 14px var(--coral-glow)}
.disc.drop{animation:fall .38s cubic-bezier(.55,0,.8,.4)}
@keyframes fall{from{transform:translateY(var(--fall))}}
.disc.revealed{animation:reveal .6s ease-out both}
@keyframes reveal{from{opacity:0;transform:scale(.6)}}
.disc.win{outline:3px solid #fff;outline-offset:2px;animation:winp 1s ease-in-out infinite}
@keyframes winp{50%{outline-color:transparent}}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 15px var(--body);border-radius:12px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:var(--ink-2);color:var(--text);flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--amber);color:#2A1A00;border-color:transparent}
.btn.small{padding:9px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}

.panel{border:1px solid var(--line);border-radius:16px;background:var(--ink-2);padding:16px;display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05}
.verdict.good{color:var(--good)}
.verdict.bad{color:var(--coral)}
.seq{font-size:22px;letter-spacing:2px;overflow-x:auto;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.next{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.next b{color:var(--text);font-family:var(--display);font-weight:500}
textarea,input[type=text]{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px var(--body)}
textarea{min-height:110px;font:13px ui-monospace,monospace}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}

.course{display:flex;flex-direction:column;gap:10px}
.course .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:10px;height:10px;border-radius:3px;background:var(--amber)}
.pips i.M{background:#9AA8FF}
.pips i.L{background:var(--coral)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.card{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;min-width:100%}
table.card th,table.card td{padding:5px 2px;text-align:center;border-bottom:1px solid var(--line);min-width:26px}
table.card th:first-child,table.card td:first-child{text-align:left;padding-right:8px;color:var(--muted);font-weight:600;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
table.card tr.hole th{color:var(--muted);font-weight:600}
table.card td.cur{background:rgba(246,183,60,.12)}
table.card td.tot,table.card th.tot{font-weight:700;color:var(--text)}
.sc{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center}
.sc.u{border:1.5px solid var(--good);border-radius:50%;color:var(--good)}
.sc.o1{border:1.5px solid var(--muted)}
.sc.o2{border:3px double var(--muted)}
.sc.x{color:var(--coral)}

.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.hist div:last-child{border-bottom:0}

.rules{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.rules h3{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.rules b{color:var(--text)}
.golf{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.golf b{color:var(--text);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
#app-name{font-size:clamp(34px,10vw,44px);letter-spacing:-.02em;text-shadow:0 0 28px rgba(246,183,60,.35)}
.langpick select{font:600 13px var(--body);color:var(--text);background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer;max-width:120px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toprow h1{margin-right:auto}
#app-name{font-size:clamp(30px,9vw,44px);letter-spacing:-.02em;text-shadow:0 0 28px rgba(246,183,60,.35)}
.langpick select{font:600 13px var(--body);color:var(--text);background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer;max-width:110px}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--line);background:var(--ink-2);color:var(--text);cursor:pointer;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lengths{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lengths .btn{padding:12px 6px;font-size:14px}
.pts{color:var(--amber);font-weight:700;margin:0}
.points .lvl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.points .lvl b{font-family:var(--display);font-weight:500;font-size:16px;color:var(--amber)}
.bar{height:8px;border-radius:999px;background:var(--ink);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#C9851A,var(--amber));border-radius:999px;transition:width .6s ease}
.small{font-size:13px}
.ad-slot{border:1px dashed var(--line);border-radius:14px;padding:14px;background:rgba(18,25,54,.5)}
.ad-slot .house{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ad-slot .house b{display:block}
.ad-slot .house p{margin:2px 0 0;font-size:13px}
.ad-slot .house .btn{flex:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--ink);font-weight:600;padding:10px 16px;border-radius:999px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tabs{grid-template-columns:repeat(5,1fr)}
.tabs button{font-size:12.5px;padding:9px 2px}
.hud.hud4{grid-template-columns:1.15fr 1fr 1fr 1.1fr}
.hud.hud4>div{padding:9px 10px}
.hud .goal{background:rgba(246,183,60,.10)}
.hud .goal .k{color:var(--amber)}
.hud .goal .v{display:flex;align-items:center;gap:6px;color:var(--amber)}
.hud .goal .v b{font-weight:800}
.hud .goal .pips{display:flex;gap:3px}
.hud .goal .v{font-size:24px}
.hud .goal .pips i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber-glow)}
.hud .goal.k5{background:rgba(255,107,122,.12)}
.hud .goal.k5 .k,.hud .goal.k5 .v{color:var(--coral)}
.hud .goal.k5 .pips i{background:var(--coral);box-shadow:0 0 6px var(--coral-glow)}
.myrank .rankrow{display:flex;align-items:baseline;gap:12px}
table.board-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.board-t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.board-t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.board-t .num{text-align:right;white-space:nowrap}
table.board-t tr.me td{background:rgba(246,183,60,.10)}
table.board-t tr.me .pn{color:var(--amber)}
table.board-t .pn{display:block;font-weight:600}
table.board-t .pl{display:block;font-size:12px;color:var(--muted)}
.markers span.threat{visibility:visible;color:#fff;background:var(--coral);border-radius:6px;font-weight:800;font-size:13px;line-height:18px;max-width:22px;margin:0 auto;width:100%;justify-content:center;align-items:center;animation:pulse 1s ease-in-out infinite}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg3 button{font:600 13px var(--body);color:var(--muted);background:none;border:0;border-radius:9px;padding:9px 4px;cursor:pointer}
.seg3 button[aria-pressed="true"]{background:var(--board-edge);color:var(--text)}
.ranks{display:flex;flex-direction:column}
.ranks>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ranks>div:last-child{border-bottom:0}
.ranks b{font-family:var(--display);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
details.more{display:block}
details.more summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-family:var(--display);color:var(--muted)}
details.more[open] summary::after{content:"–"}
.morebody{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.morebody .hcp{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.morebody .hcp b{font-family:var(--display);font-weight:500;font-size:20px}
.morebody .hcp p{grid-column:1/-1;margin:0}
.overlay{position:absolute;inset:0;border-radius:18px;background:rgba(8,12,26,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:3}
.overlay h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;text-wrap:balance}
.overlay p{margin:0;color:var(--muted);max-width:30ch}
.overlay .btn{flex:none}
.hud .turn{display:flex;align-items:center;gap:7px;font-size:16px}
.hud .turn i{width:14px;height:14px;border-radius:50%;flex:none}
.pdot1{background:var(--amber);box-shadow:0 0 8px var(--amber-glow)}
.pdot2{background:var(--coral);box-shadow:0 0 8px var(--coral-glow)}
.pvp-score{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.pvp-score i{width:12px;height:12px;border-radius:50%;display:inline-block}
.invite{border-color:var(--amber)}
.markers span.on.m1{color:var(--amber)}
.rules h3+.golf{margin-top:-4px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="toprow">
      <h1 id="app-name">Quadlume</h1>
      <label class="langpick"><span class="sr" data-t="language">Språk</span>
        <select id="lang" aria-label="Språk"></select>
      </label>
      <button class="iconbtn js-share" type="button" data-ta="share_app"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
    </div>
    <p class="muted" data-t="tagline">Fire på rad i mørket, spilt som golf: færrest mulig trekk per hull.</p>
  </header>

  <nav class="tabs" role="tablist" data-ta="tabs_aria">
    <button type="button" role="tab" id="t-daily" data-view="daily" aria-selected="true" data-t="tab_daily">Dagens</button>
    <button type="button" role="tab" id="t-round" data-view="round" aria-selected="false" data-t="tab_round">Runde</button>
    <button type="button" role="tab" id="t-duel" data-view="duel" aria-selected="false" data-t="tab_duel">Duell</button>
    <button type="button" role="tab" id="t-board" data-view="board" aria-selected="false" data-t="tab_board">Tabell</button>
    <button type="button" role="tab" id="t-profile" data-view="profile" aria-selected="false" data-t="tab_profile">Profil</button>
  </nav>

  <!-- DAGENS -->
  <section class="view" id="v-daily">
    <div class="eyebrow">
      <span id="d-num">#23</span>
      <div class="nav">
        <button id="d-prev" type="button" data-ta="prev_aria">‹</button>
        <button id="d-next" type="button" data-ta="next_aria">›</button>
      </div>
    </div>
    <p class="muted" id="d-date"></p>
    <span class="chip" id="d-chip"><i></i></span>
    <div class="note" id="d-practice" hidden data-t="practice_note"></div>
    <div id="d-slot"></div>
    <div class="panel" id="d-result" hidden>
      <div class="verdict" id="d-verdict"></div>
      <p class="muted" id="d-vsub"></p>
      <div class="seq" id="d-seq"></div>
      <p class="pts" id="d-pts"></p>
      <div class="stats">
        <div><b id="ds-played">0</b><span data-t="st_played"></span></div>
        <div><b id="ds-under">0</b><span data-t="st_under"></span></div>
        <div><b id="ds-streak">0</b><span data-t="st_streak"></span></div>
        <div><b id="ds-avg">–</b><span data-t="st_avg"></span></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="d-share" type="button" data-t="copy_result"></button>
        <button class="btn" id="d-again" type="button" data-t="practice_again"></button>
      </div>
      <textarea id="d-share-fb" hidden readonly data-ta="copy_result"></textarea>
      <div class="next" id="d-countdown"><span data-t="next_board"></span> <b>00:00:00</b></div>
    </div>
    <aside class="ad-slot" data-ad-slot="daily-result">
      <!-- REKLAMEPLASS «daily-result»: Når reklame skal på, limes annonsekoden inn her (se ADS_ENABLED i koden). Frem til da vises en egen invitasjon. -->
      <div class="house"><div><b data-t="house_title"></b><p class="muted" data-t="house_text"></p></div><button class="btn small js-share" type="button"><span data-t="share_app"></span></button></div>
    </aside>
  </section>

  <!-- RUNDE -->
  <section class="view" id="v-round" hidden>
    <div id="r-menu" class="view">
      <div class="panel course">

const APP_NAME='Quadlume';
const SITE='quadlume.com';
/* Reklame: sett til true og lim inn annonsekode i elementene med class="ad-slot" når du har en annonseavtale.
   Til da viser plassene en invitasjon til å dele spillet. */
const ADS_ENABLED=false;
const $=id=>document.getElementById(id);
const LAUNCH=Date.UTC(2026,8,1);
let R=6,C=7,K=4,B=[];
const TYPES={
  K:{key:'K',R:6,C:7,K:4,opt:2,pieces:[8,10,12]},
  M:{key:'M',R:7,C:8,K:4,opt:3,pieces:[10,12,14]},
  L:{key:'L',R:7,C:9,K:5,opt:3,slack:2,pieces:[16,18,20]}
};
const COURSE='MKLMMKMLMMKMLMKMLM';

/* ---------- lagring ---------- */
let store={daily:{},rounds:[],current:null,name:'',lang:null};
try{const s=JSON.parse(localStorage.getItem('mb-v2')||'null');if(s&&typeof s==='object') store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem('mb-v2',JSON.stringify(store));}catch(e){}}
function typePar(k){const tp=TYPES[k];return tp.opt+(tp.slack||1);}
/* Et hull teller aldri mer enn dobbel bogey (par + 2), som i golfens handicapregler. */
const MAX_OVER=2;
(function migrate(){
  if(store.v>=6) return;
  (store.rounds||[]).forEach(r=>{
    if(!r.scores||!r.pars) return;
    if(!r.wins) r.wins=r.scores.map((x,i)=>x-r.pars[i]<4);
    r.scores=r.scores.map((x,i)=>Math.min(x,r.pars[i]+MAX_OVER));
    if(r.oppScores) r.oppScores=r.oppScores.map((x,i)=>x==null?x:Math.min(x,r.pars[i]+MAX_OVER));
    r.strokes=r.scores.reduce((a,b)=>a+b,0);r.par=r.pars.reduce((a,b)=>a+b,0);
  });
  Object.values(store.daily||{}).forEach(r=>{if(r.moves==null&&r.win) r.moves=r.score;r.score=Math.min(r.score,r.par+MAX_OVER);});
  if(store.current&&store.current.scores) store.current.scores=store.current.scores.map((x,i)=>x==null?x:Math.min(x,typePar(COURSE[i])+MAX_OVER));
  store.v=6;save();
})();

/* ---------- språk ---------- */
function detectLang(){
  const list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
  for(const l of list){const b=String(l).toLowerCase().split('-')[0];
    if(b==='nb'||b==='nn'||b==='no') return 'nb';
    if(I18N[b]) return b;}
  return 'en';
}
let lang=store.lang&&I18N[store.lang]?store.lang:detectLang();
function t(k,p){let s=(I18N[lang]&&I18N[lang][k]!=null)?I18N[lang][k]:(I18N.en[k]!=null?I18N.en[k]:k);
  if(p) s=s.replace(/\{(\w+)\}/g,(m,x)=>p[x]!=null?p[x]:m);return s;}
function applyStatic(){
  document.documentElement.lang=lang==='nb'?'nb':lang;
  document.title=APP_NAME;
  $('app-name').textContent=APP_NAME;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  document.querySelectorAll('[data-th]').forEach(el=>{el.innerHTML=t(el.dataset.th);});
  document.querySelectorAll('[data-tp]').forEach(el=>{el.placeholder=t(el.dataset.tp,{code:'QL.9.k3j2h1.435443544.Alex'});});
  document.querySelectorAll('[data-ta]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ta));});
  $('lang').setAttribute('aria-label',t('language'));
}
const sel=$('lang');
LANGS.forEach(([code,name])=>{const o=document.createElement('option');o.value=code;o.textContent=name;sel.appendChild(o);});
sel.value=lang;
sel.addEventListener('change',()=>{lang=sel.value;store.lang=lang;save();applyStatic();setView(view);});
function locale(){return LOCALES[lang]||'en-GB';}

/* ---------- kjerne ---------- */
function emptyB(){return Array.from({length:R},()=>Array(C).fill(0));}
function copyB(b){return b.map(r=>r.slice());}
function landRow(c){for(let r=R-1;r>=0;r--) if(!B[r][c]) return r; return -1;}
function winAt(r,c){
  const p=B[r][c]; if(!p) return null;
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
    const line=[[r,c]];
    for(const s of [1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<R&&cc>=0&&cc<C&&B[rr][cc]===p){line.push([rr,cc]);rr+=dr*s;cc+=dc*s;}}
    if(line.length>=K) return line;
  }
  return null;
}
/* Spilleren ser lenger enn boten: alle ruter innen to steg (ett steg på skrå). Boten ser bare én rute rundt seg. */
const PLAYER_VIEW=2;
function playerSees(r,c,p){p=p||1;for(let dr=-PLAYER_VIEW;dr<=PLAYER_VIEW;dr++)for(let dc=-PLAYER_VIEW;dc<=PLAYER_VIEW;dc++){if(Math.abs(dr)+Math.abs(dc)>PLAYER_VIEW) continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C&&B[rr][cc]===p) return true;}return false;}
function seesCell(p,r,c){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C&&B[rr][cc]===p) return true;}return false;}
function knownFilled(p){const k=emptyB().map(r=>r.map(()=>false));for(let c=0;c<C;c++){let top=-1;for(let r=0;r<R;r++) if(B[r][c]===p){top=r;break;}if(top>=0) for(let r=top+1;r<R;r++) k[r][c]=true;}return k;}
function hash(n){n=n|0;n=Math.imul(n^(n>>>16),0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);return (n^(n>>>16))>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* Boten er deterministisk: samme brett og samme trekk gir samme svar for alle. */
/* Boten prøver å vinne selv: den bygger egne rekker, blokkerer trusler den ser eller hører,
   og unngår trekk som gir deg vinnerruten rett over. Den er deterministisk: samme brett og samme trekk gir samme svar. */
const WEIGHT=[0,1,4,12,40,120];
/* Lange hull (fem på rad): boten er litt mindre pågående, ellers blir de for vanskelige. */
const BOT5={w:[0,1,4,12,40,120],noiseDiv:400,lid:true,lazy:50};
let BOT_IMPL=null;
function lineScore(r,c,p,W){
  W=W||WEIGHT;const o=3-p;let s=0;
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
    for(let k=0;k<K;k++){
      const r0=r-dr*k,c0=c-dc*k,r1=r0+dr*(K-1),c1=c0+dc*(K-1);
      if(r0<0||r0>=R||c0<0||c0>=C||r1<0||r1>=R||c1<0||c1>=C) continue;
      let mine=0,bad=false;
      for(let i=0;i<K;i++){const v=B[r0+dr*i][c0+dc*i];if(v===o){bad=true;break;}if(v===p) mine++;}
      if(!bad) s+=W[mine];
    }
  }
  return s;
}
function botThreats(){
  const out=[];for(let c=0;c<C;c++){const r=landRow(c);if(r<0) continue;B[r][c]=2;if(winAt(r,c)) out.push(c);B[r][c]=0;}
  return out;
}
function botChoose(seed,mv,hist){
  if(BOT_IMPL) return BOT_IMPL(seed,mv,hist);
  const valid=[];for(let c=0;c<C;c++) if(!B[0][c]) valid.push(c);
  if(!valid.length) return -1;
  /* 1. Vinn hvis det går. */
  for(const c of valid){const r=landRow(c);B[r][c]=2;const w=winAt(r,c);B[r][c]=0;if(w) return c;}
  /* 2. Blokker en vinnertrussel den ser (én rute rundt egne brikker). */
  for(const c of valid){const r=landRow(c);B[r][c]=1;const w=winAt(r,c);B[r][c]=0;if(w&&seesCell(2,r,c)) return c;}
  /* 3. Den hører deg: har du stablet K−1 brikker i samme kolonne, legger den lokk på. */
  const long=K===5;
  if(!long||BOT5.lid) for(const c of valid){const r=landRow(c);if(r+K-1<R){let all=true;for(let i=1;i<K;i++) if(B[r+i][c]!==1){all=false;break;}if(all) return c;}}
  /* 4. Ellers: bygg egne rekker. */
  const mid=(C-1)/2;let best=valid[0],bs=-1e9;
  for(const c of valid){
    const r=landRow(c);
    B[r][c]=2;
    const lazy=long&&BOT5.lazy>0&&(hash(seed*131+mv*17)%100)<BOT5.lazy;
    let s=lazy?0:lineScore(r,c,2,long?BOT5.w:WEIGHT);
    if(r>0){B[r-1][c]=1;if(winAt(r-1,c)) s-=500;B[r-1][c]=0;}
    B[r][c]=0;
    s+=(2-Math.abs(c-mid)*0.5);
    s+=(hash(seed*977+mv*31+c)%1000)/(long?BOT5.noiseDiv:400);
    if(s>bs){bs=s;best=c;}
  }
  return best;
}
function dfs(seed,depth,mv,hist){
  for(let c=0;c<C;c++){
    const r=landRow(c);if(r<0) continue;
    B[r][c]=1;
    if(winAt(r,c)){B[r][c]=0;return true;}
    if(depth>1){
      hist.push(c);
      const bc=botChoose(seed,mv,hist);
      let ok=false;
      if(bc>=0){const br=landRow(bc);B[br][bc]=2;ok=!winAt(br,bc)&&dfs(seed,depth-1,mv+1,hist);B[br][bc]=0;}
      hist.pop();
      if(ok){B[r][c]=0;return true;}
    }
    B[r][c]=0;
  }
  return false;
}
function optFor(board,seed,maxD){for(let d=1;d<=maxD;d++){B=copyB(board);if(dfs(seed,d,0,[])) return d;}return 0;}
const cache={};
function genHole(type,base){
  const key=type+':'+base; if(cache[key]) return cache[key];
  const tp=TYPES[type]; R=tp.R;C=tp.C;K=tp.K;
  let fb=null;
  for(let a=0;a<200;a++){
    const seed=hash(base+a*104729);
    const rng=mulberry32(seed);
    B=emptyB();
    const n=tp.pieces[Math.floor(rng()*tp.pieces.length)];
    let p=1,placed=0,tries=0;
    while(placed<n&&tries<400){
      tries++;
      const c=Math.min(C-1,Math.floor((rng()+rng()+rng())/3*C));
      const r=landRow(c);if(r<0) continue;
      B[r][c]=p;
      if(winAt(r,c)){B[r][c]=0;continue;}
      placed++;p=3-p;
    }
    if(placed<n) continue;
    const board=copyB(B);
    const opt=optFor(board,seed,tp.opt);
    if(opt===tp.opt) return cache[key]={type,R:tp.R,C:tp.C,K:tp.K,board,seed,opt,par:opt+(tp.slack||1)};
    if(opt>=2&&!fb) fb={type,R:tp.R,C:tp.C,K:tp.K,board,seed,opt,par:opt+(tp.slack||1)};
  }
  return cache[key]=fb;
}
function typeName(k){return t('type_'+k);}
function typeDesc(k){return t('desc_'+k);}

/* ---------- ett hull ---------- */
function newHole(spec,cfg){return {spec,B:copyB(spec.board),hist:[],moves:0,matches:cfg.matches,maxMatches:cfg.matches,over:null,winLine:null,lastBot:null,seq:[],fullMsg:false,busy:false,flash:false,dropAnim:null,score:null,onDone:cfg.onDone};}
function use(h){R=h.spec.R;C=h.spec.C;K=h.spec.K;B=h.B;}
const EXTRA_MOVES=5;
function maxMoves(h){return h.spec.par+EXTRA_MOVES;}
function play(h,c){
  if(h.busy||h.over) return; use(h);
  h.busy=true;h.fullMsg=false;
  const r=landRow(c);h.moves++;h.hist.push(c);
  if(r<0){h.seq.push('⚫');h.fullMsg=true;}
  else{B[r][c]=1;h.dropAnim={r,c};h.seq.push('🟡');const w=winAt(r,c);if(w){h.winLine=w;return endHole(h,true,'win');}}
  h.lastBot=null;renderGame();
  setTimeout(()=>{
    use(h);
    const bc=botChoose(h.spec.seed,h.moves-1,h.hist);
    if(bc>=0){const br=landRow(bc);B[br][bc]=2;h.lastBot={c:bc};const w=winAt(br,bc);if(w){h.winLine=w;return endHole(h,false,'bot');}}
    if(h.moves>=maxMoves(h)) return endHole(h,false,'moves');
    if(B[0].every(x=>x)) return endHole(h,false,'full');
    h.busy=false;renderGame();
  },650);
}
function endHole(h,win,reason){
  h.over={win,reason};h.busy=false;h.seq.push(win?'🏆':'💀');
  h.score=win?Math.min(h.moves,h.spec.par+MAX_OVER):h.spec.par+MAX_OVER;
  renderGame();
  if(h.onDone) h.onDone(h);
}
function golfName(diff,win,reason){
  if(win===false) return reason==='bot'?t('g_botwon'):t('g_darkwon');
  const m={'-3':'g_albatross','-2':'g_eagle','-1':'g_birdie','0':'g_par','1':'g_bogey','2':'g_dbogey','3':'g_tbogey'}[diff];
  return m?t(m):(diff<0?t('g_albatross'):t('g_finished'));
}
function fmtDiff(d){return d===0?'E':(d>0?'+':'−')+Math.abs(d);}
function fmtNum(x){return x.toLocaleString(locale(),{minimumFractionDigits:1,maximumFractionDigits:1});}
function holeEmoji(d,win){return win===false?'🔴':d<=-1?'🟢':d===0?'⚪':d===1?'🟡':'🟠';}

/* ---------- visning av spillflaten ---------- */
let view='daily';
function activeHole(){
  if(view==='daily') return daily.hole;
  if(view==='round'&&round&&!round.done) return round.hole;
  return null;
}
function renderGame(){
  const g=$('game');
  if(view==='duel'){if(pvp){g.hidden=false;return renderPvp();}g.hidden=true;return;}
  const h=activeHole();
  if(!h){g.hidden=true;return;}
  g.hidden=false; use(h);
  $('g-par-cell').hidden=false;$('g-turn-cell').hidden=true;$('g-pass').hidden=true;
  $('g-par').textContent=h.spec.par;
  $('g-goal').innerHTML=`<b>${K}</b><span class="pips">${'<i></i>'.repeat(K)}</span>`;
  $('g-goal-cell').classList.toggle('k5',K===5);
  $('g-moves').innerHTML=`${h.moves} <small>/ ${maxMoves(h)}</small>`;
  const fl=$('g-flames');fl.innerHTML='';
  for(let i=0;i<h.maxMatches;i++){const f=document.createElement('span');f.className='flame'+(i<h.matches?'':' used');fl.appendChild(f);}

  const reveal=!!h.over||h.flash;
  const kf=knownFilled(1);
  const winSet=new Set((h.winLine||[]).map(([r,c])=>r+','+c));
  const bd=$('g-board');bd.innerHTML='';bd.classList.toggle('flash',h.flash);
  bd.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`;
  const canPlay=!h.over&&!h.busy;
  for(let c=0;c<C;c++){
    const col=document.createElement('button');
    col.type='button';col.className='col';col.disabled=!canPlay;
    col.style.gridTemplateRows=`repeat(${R},auto)`;
    col.setAttribute('aria-label',t('col_aria',{c:c+1}));
    col.addEventListener('click',()=>play(h,c));
    for(let r=0;r<R;r++){
      const cell=document.createElement('div');cell.className='cell';
      const val=B[r][c],vis=playerSees(r,c);let show=false;
      if(reveal||vis){cell.classList.add('lit');show=!!val;}
      else cell.classList.add(kf[r][c]?'fogfill':'fog');
      if(show){
        const d=document.createElement('div');d.className='disc p'+val;
        if(h.over&&val===2&&!vis) d.classList.add('revealed');
        if(h.dropAnim&&h.dropAnim.r===r&&h.dropAnim.c===c){d.classList.add('drop');d.style.setProperty('--fall',`-${(r+1)*112}%`);}
        if(winSet.has(r+','+c)) d.classList.add('win');
        cell.appendChild(d);
      }
      col.appendChild(cell);
    }
    bd.appendChild(col);
  }
  h.dropAnim=null;
  /* Varsel: kolonner der boten kan vinne i neste trekk. Du «hører» det, men ser ikke brikkene. */
  const threats=(!h.over&&!h.busy&&!h.flash)?botThreats():[];
  const mk=$('g-markers');mk.innerHTML='';mk.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`;
  for(let c=0;c<C;c++){const s=document.createElement('span');
    if(threats.includes(c)){s.textContent='!';s.className='threat';}
    else{s.textContent='▼';if(h.lastBot&&!h.over&&h.lastBot.c===c) s.className='on';}
    mk.appendChild(s);}

  const left=maxMoves(h)-h.moves;let main,sub;
  if(h.over){main=h.over.win?t('gm_win',{k:K}):h.over.reason==='bot'?t('gm_botwin',{k:K}):t('gm_nomoves');sub=t('gm_lit');}
  else if(h.flash){main=t('gm_flash');sub=t('gm_flash_sub');}
  else if(h.busy){main=t('gm_botturn');sub=h.fullMsg?t('gm_full'):t('gm_botsees');}
  else{
    main=h.moves===0?t('gm_turn'):t('gm_turn_left',{n:left});
    sub=h.lastBot?t('gm_heard',{c:h.lastBot.c+1}):t('gm_intro',{k:K});
    if(h.fullMsg) sub=t('gm_full_pre')+' '+sub;
    if(threats.length) sub=t('gm_threat',{k:K,c:threats.map(x=>x+1).join(', ')});
  }
  $('g-main').textContent=main;$('g-sub').textContent=sub;
  $('g-match').disabled=!canPlay||h.matches<1||h.flash;
}
$('g-match').addEventListener('click',()=>{
  if(view==='duel'&&pvp){
    const v=pvp.turn;if(pvp.busy||pvp.over||pvp.pass||pvp.matches[v]<1) return;
    pvp.matches[v]--;pvp.flash=true;pvp.busy=true;renderPvp();
    const game=pvp;setTimeout(()=>{if(pvp!==game) return;pvp.flash=false;pvp.busy=false;renderPvp();},2000);
    return;
  }
  const h=activeHole();if(!h||h.busy||h.over||h.matches<1) return;
  h.matches--;h.flash=true;h.busy=true;h.seq.push('🔥');renderGame();
  setTimeout(()=>{h.flash=false;h.busy=false;renderGame();},2000);
});

/* ---------- Dagens ---------- */
function todayIdx(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-LAUNCH)/864e5)+1;}
function dateLabel(i){const s=new Date(LAUNCH+(i-1)*864e5).toLocaleDateString(locale(),{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1);}
function dailyType(d){return 'KML'[hash(d*131+7)%3];}
const daily={day:todayIdx(),hole:null,practice:false,lastRes:null};
function loadDaily(d){
  daily.day=d;
  const spec=genHole(dailyType(d),hash(d*7919+1));
  daily.practice=!!store.daily[d];
  daily.lastRes=daily.practice?store.daily[d]:null;
  daily.hole=newHole(spec,{matches:2,onDone:onDailyDone});
  $('d-share-fb').hidden=true;
  renderDaily();
}
function onDailyDone(h){
  const res={score:h.score,moves:h.moves,par:h.spec.par,win:h.over.win,reason:h.over.reason,seq:h.seq.join(''),matches:h.maxMatches-h.matches,type:h.spec.type,K:h.spec.K};
  if(!daily.practice){store.daily[daily.day]=res;save();}
  daily.lastRes=res;daily.fresh=true;
  renderDaily();
}
function renderDaily(){
  const d=daily.day,k=daily.hole.spec.type;
  $('d-num').textContent=t('board_no',{n:d});
  $('d-date').textContent=dateLabel(d)+(d===todayIdx()?t('today'):'');
  $('d-prev').disabled=d<=1;$('d-next').disabled=d>=todayIdx();
  $('d-chip').className='chip '+k;$('d-chip').innerHTML='<i></i>';$('d-chip').append(`${typeName(k)} · ${typeDesc(k)}`);
  $('d-practice').hidden=!daily.practice;
  if(daily.lastRes) showDailyResult(daily.lastRes); else $('d-result').hidden=true;
  renderGame();
}
function showDailyResult(res){
  const diff=res.score-res.par;
  const v=$('d-verdict');v.textContent=golfName(diff,res.win,res.reason);v.className='verdict '+(res.win&&diff<=0?'good':res.win?'':'bad');
  const fy=res.matches===1?t('match1'):t('matchN',{n:res.matches});
  const mv=res.moves||res.score;
  $('d-vsub').textContent=(res.win?t('res_win',{s:mv,p:res.par,m:fy})+(mv>res.score?' '+t('counts_as',{s:res.score}):''):t('res_loss',{s:res.score,p:res.par}))+(daily.practice&&daily.fresh?t('practice_suffix'):'');
  $('d-seq').textContent=res.seq;
  const sv=store.daily[daily.day];
  $('d-pts').textContent=(!daily.practice||!daily.fresh)&&sv?t('pts_earned',{n:starsFor(sv.score-sv.par,sv.win)}):'';
  const keys=Object.keys(store.daily).map(Number);
  let under=0,sum=0;keys.forEach(k=>{const r=store.daily[k];sum+=r.score-r.par;if(r.win&&r.score<=r.par) under++;});
  let streak=0;for(let x=todayIdx();store.daily[x];x--) streak++;
  $('ds-played').textContent=keys.length;$('ds-under').textContent=under;$('ds-streak').textContent=streak;
  const avg=keys.length?sum/keys.length:null;
  $('ds-avg').textContent=avg==null?'–':(avg>0?'+':avg<0?'−':'')+fmtNum(Math.abs(avg));
  const saved=store.daily[daily.day]||res, sd=saved.score-saved.par;
  $('d-share').dataset.text=`${APP_NAME} #${daily.day} 🌑\n${TYPES[saved.type]?typeName(saved.type):''} · ${golfName(sd,saved.win,saved.reason)}${saved.win?' · '+t('moves_par',{s:saved.moves||saved.score,p:saved.par}):''}\n${saved.seq}\n${SITE}`;
  $('d-share').textContent=t('copy_result');
  $('d-countdown').hidden=daily.day!==todayIdx();
  $('d-result').hidden=false;
}
$('d-prev').addEventListener('click',()=>{if(daily.day>1) loadDaily(daily.day-1);});
$('d-next').addEventListener('click',()=>{if(daily.day<todayIdx()) loadDaily(daily.day+1);});
$('d-again').addEventListener('click',()=>{const d=daily.day;loadDaily(d);daily.practice=true;daily.lastRes=null;daily.fresh=false;renderDaily();});

/* ---------- Runder ---------- */
let round=null;
function isoWeek(){const d=new Date();const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=x.getUTCFullYear();const w=Math.ceil(((x-Date.UTC(y,0,1))/864e5+1)/7);return {y,w};}
function weekSeed(){const {y,w}=isoWeek();return hash(y*100+w)%2176782336;}
function holeBase(seed,i){return hash(seed*31+i*7717+5);}
function courseLabel(kind,holes){const {w}=isoWeek();return (kind==='week'?t('week_n',{w}):kind==='duel'?t('lbl_duel'):t('random'))+t('lbl_holes',{n:holes});}
function startRound(kind,holes,seed,opp){
  round={kind,holes,seed,opp:opp||null,idx:0,scores:[],wins:[],pars:[],types:[],hole:null,done:false};
  for(let i=0;i<holes;i++){round.types[i]=COURSE[i];round.pars[i]=typePar(COURSE[i]);}
  store.current={kind,holes,seed,opp:round.opp,idx:0,scores:[]};save();
  startRoundHole();
}
function startRoundHole(){
  const spec=genHole(round.types[round.idx],holeBase(round.seed,round.idx));
  round.pars[round.idx]=spec.par;
  round.hole=newHole(spec,{matches:1,onDone:onRoundHoleDone});
  $('r-holedone').hidden=true;$('r-confirm').hidden=true;
  renderRound();
}
function onRoundHoleDone(h){
  round.scores[round.idx]=h.score;round.wins[round.idx]=h.over.win;
  store.current.idx=round.idx;store.current.scores=round.scores.slice();store.current.wins=round.wins.slice();save();
  renderRound();
}
function renderHoleDone(){
  const h=round.hole;if(!h||!h.over){$('r-holedone').hidden=true;return;}
  const diff=h.score-h.spec.par;
  const v=$('r-verdict');v.textContent=golfName(diff,h.over.win,h.over.reason);v.className='verdict '+(h.over.win&&diff<=0?'good':h.over.win?'':'bad');
  let sub=(h.over.win?t('rh_win',{s:h.moves,p:h.spec.par})+(h.moves>h.score?' '+t('counts_as',{s:h.score}):''):t('rh_loss',{s:h.score}))+' '+t('pts_earned',{n:starsFor(diff,h.over.win)})+'.';
  if(round.opp){const o=round.opp.scores[round.idx];if(o!=null) sub+=t('opp_used',{o:round.opp.name,n:o})+(h.score<o?t('you_won_hole'):h.score>o?t('opp_won_hole',{o:round.opp.name}):t('halved'));}
  $('r-vsub').textContent=sub;
  $('r-next').textContent=round.idx+1>=round.holes?t('see_result'):t('next_hole');
  $('r-holedone').hidden=false;
}
$('r-next').addEventListener('click',()=>{
  round.idx++;
  if(round.idx>=round.holes) return finishRound();
  store.current.idx=round.idx;save();
  startRoundHole();
});
function sumArr(a){return a.reduce((s,x)=>s+(x||0),0);}
function matchStatus(){
  if(!round.opp) return null;
  let w=0,l=0,hv=0;
  round.scores.forEach((s,i)=>{const o=round.opp.scores[i];if(s==null||o==null) return;if(s<o) w++;else if(s>o) l++;else hv++;});
  return {w,l,hv,up:w-l};
}
function finishRound(){
  round.done=true;
  const strokes=sumArr(round.scores),par=sumArr(round.pars.slice(0,round.holes));
  const birdies=round.scores.filter((s,i)=>s<round.pars[i]).length;
  const rec={t:Date.now(),kind:round.kind,holes:round.holes,strokes,par,birdies,opp:round.opp?round.opp.name:null,ms:matchStatus(),scores:round.scores.slice(0,round.holes),pars:round.pars.slice(0,round.holes),wins:round.wins.slice(0,round.holes),oppScores:round.opp?round.opp.scores.slice(0,round.holes):null};
  store.rounds.push(rec);
  if(round.opp) recordFriend(round.opp.name,null,rec.ms);
  store.current=null;save();
  renderRound();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderCard(el,highlight){
  const n=round.holes;const halves=n===18?[[0,9],[9,18]]:[[0,n]];
  const me=(store.name||'').trim()||t('sc_you');
  let html='';
  halves.forEach(([a,b],hi)=>{
    let h=`<table class="card"><tr class="hole"><th>${esc(t('sc_hole'))}</th>`;
    for(let i=a;i<b;i++) h+=`<th>${i+1}</th>`;
    h+=`<th class="tot">${esc(n===18?(hi?t('sc_in'):t('sc_out')):t('sc_tot'))}</th></tr>`;
    h+=`<tr><td>${esc(t('sc_par'))}</td>`;for(let i=a;i<b;i++) h+=`<td>${round.pars[i]}</td>`;h+=`<td class="tot">${sumArr(round.pars.slice(a,b))}</td></tr>`;
    const row=(name,scores,isMe)=>{let r=`<tr><td>${esc(name)}</td>`;for(let i=a;i<b;i++){const s=scores[i];const cur=isMe&&highlight&&i===round.idx&&!round.done;
      if(s==null){r+=`<td class="${cur?'cur':''}">${cur?'•':''}</td>`;continue;}
      const d=s-round.pars[i];const cls=(isMe&&round.wins[i]===false)?'x':d<0?'u':d===1?'o1':d>=2?'o2':'';
      r+=`<td class="${cur?'cur':''}"><span class="sc ${cls}">${s}</span></td>`;}
      const played=scores.slice(a,b).filter(x=>x!=null);r+=`<td class="tot">${played.length?sumArr(played):''}</td></tr>`;return r;};
    h+=row(me,round.scores,true);
    if(round.opp) h+=row(round.opp.name,round.opp.scores,false);
    h+='</table>';html+=h;
  });

}
function renderRound(){
  const {w}=isoWeek();
  $('r-week-title').textContent=t('week_n',{w});

      el.textContent=ms.up>0?t('duel_you',{o:round.opp.name}):ms.up<0?t('duel_opp',{o:round.opp.name}):t('duel_tie');
      el.className='verdict '+(ms.up>0?'good':ms.up<0?'bad':'');
      sub+=t('duel_line',{w:ms.w,l:ms.l,h:ms.hv,o:round.opp.name,t:round.opp.total});
    }else $('rs-duel').hidden=true;
    $('rs-sub').textContent=sub;
    $('rs-seq').textContent=round.scores.map((s,i)=>holeEmoji(s-round.pars[i],round.wins[i])).join('');

    renderCard($('rs-card'),false);
  }
  renderGame();

/* ---------- Duell ---------- */
function parseChallenge(txt){
  /* Godtar nye (QL.) og eldre koder (QD., QX., GL., MB.). */
  let src=txt||'';try{src=decodeURIComponent(src);}catch(e){}
  const m=/(?:QL|QD|QX|GL|MB)\.(3|6|9|18)\.([0-9a-z]+)\.([0-9a-z]+)(?:\.([^\s.]+))?(?:\.(\d+))?/i.exec(src);
  if(!m) return {err:t('err_nocode',{ex:'QL.9.k3j2h1.435443544.Alex'})};
  const holes=+m[1],seed=parseInt(m[2],36);let sc=m[3].toLowerCase().split('').map(ch=>parseInt(ch,36));
  if(sc.length!==holes||sc.some(isNaN)) return {err:t('err_count',{a:sc.length,b:holes})};
  sc=sc.map((x,i)=>Math.min(x,typePar(COURSE[i])+MAX_OVER));
  const name=(m[4]||t('opponent')).replace(/_/g,' ').slice(0,20);
  return {holes,seed,opp:{name,scores:sc,total:sumArr(sc)},stars:m[5]!=null?+m[5]:null};
}
$('du-start').addEventListener('click',()=>{
  const p=parseChallenge($('du-input').value);
  if(p.err){$('du-msg').textContent=p.err;return;}
  $('du-msg').textContent='';$('du-input').value='';
  acceptChallenge(p);
});

/* ---------- Ekte duell på samme mobil: tomt brett, ingen bot ---------- */
let pvp=null,pvpStarter=1;const pvpScore={1:0,2:0};
function pvpName(p){return t(p===1?'p_yellow':'p_red');}
function startPvp(){
  R=6;C=7;K=4;
  pvp={R:6,C:7,K:4,B:emptyB(),turn:pvpStarter,matches:{1:1,2:1},moves:{1:0,2:0},over:null,winLine:null,last:null,pass:true,flash:false,busy:false,dropAnim:null};
  pvpStarter=3-pvpStarter;renderDuel();
}
function usePvp(){R=pvp.R;C=pvp.C;K=pvp.K;B=pvp.B;}
function pvpPlay(c){
  if(!pvp||pvp.over||pvp.busy||pvp.pass) return;usePvp();
  const p=pvp.turn;pvp.busy=true;pvp.moves[p]++;
  const r=landRow(c);
  if(r<0) pvp.last={p,c,full:true};
  else{
    B[r][c]=p;pvp.dropAnim={r,c};pvp.last={p,c,full:false};
    const w=winAt(r,c);
    if(w){pvp.winLine=w;pvp.over={winner:p};pvpScore[p]++;pvp.busy=false;return renderDuel();}
    if(B[0].every(x=>x)){pvp.over={winner:0};pvp.busy=false;return renderDuel();}
  }
  renderPvp();
  const game=pvp;
  setTimeout(()=>{if(pvp!==game) return;pvp.turn=3-p;pvp.pass=true;pvp.busy=false;renderPvp();},r<0?1300:800);
}
function renderPvp(){
  usePvp();const v=pvp.turn,o=3-v,hide=pvp.pass&&!pvp.over;
  $('g-par-cell').hidden=true;$('g-turn-cell').hidden=false;
  $('g-goal').innerHTML=`<b>${K}</b><span class="pips">${'<i></i>'.repeat(K)}</span>`;
  $('g-goal-cell').classList.remove('k5');
  $('g-turn').innerHTML=`<i class="pdot${v}"></i>`;$('g-turn').append(pvpName(v));
  $('g-moves').textContent=pvp.moves[v];
  const fl=$('g-flames');fl.innerHTML='';const f=document.createElement('span');f.className='flame'+(pvp.matches[v]>0?'':' used');fl.appendChild(f);
  const reveal=!!pvp.over||pvp.flash,kf=knownFilled(v);
  const winSet=new Set((pvp.winLine||[]).map(([r,c])=>r+','+c));
  const bd=$('g-board');bd.innerHTML='';bd.classList.toggle('flash',pvp.flash);
  bd.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`;
  const canPlay=!pvp.over&&!pvp.busy&&!pvp.pass;
  for(let c=0;c<C;c++){
    const col=document.createElement('button');
    col.type='button';col.className='col';col.disabled=!canPlay;
    col.style.gridTemplateRows=`repeat(${R},auto)`;
    col.setAttribute('aria-label',t('col_aria',{c:c+1}));
    col.addEventListener('click',()=>pvpPlay(c));
    for(let r=0;r<R;r++){
      const cell=document.createElement('div');cell.className='cell';
      const val=B[r][c],vis=!hide&&playerSees(r,c,v);let show=false;
      if(!hide&&(reveal||vis)){cell.classList.add('lit');show=!!val;}
      else cell.classList.add(!hide&&kf[r][c]?'fogfill':'fog');
      if(show){
        const d=document.createElement('div');d.className='disc p'+val;
        if(pvp.over&&!playerSees(r,c,v)) d.classList.add('revealed');
        if(pvp.dropAnim&&pvp.dropAnim.r===r&&pvp.dropAnim.c===c){d.classList.add('drop');d.style.setProperty('--fall',`-${(r+1)*112}%`);}
        if(winSet.has(r+','+c)) d.classList.add('win');
        cell.appendChild(d);
      }
      col.appendChild(cell);
    }
    bd.appendChild(col);
  }
  pvp.dropAnim=null;
  const last=pvp.last,heard=last&&last.p===o&&!pvp.over&&!hide;
  const mk=$('g-markers');mk.innerHTML='';mk.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`;
  for(let c=0;c<C;c++){const sp=document.createElement('span');sp.textContent='▼';if(heard&&last.c===c) sp.className='on'+(o===1?' m1':'');mk.appendChild(sp);}
  let main,sub;
  if(pvp.over){main=pvp.over.winner?t('pvp_won',{p:pvpName(pvp.over.winner)}):t('pvp_draw');sub=t('gm_lit');}
  else if(hide){main=t('pvp_turn',{p:pvpName(v)});sub='';}
  else if(pvp.flash){main=t('gm_flash');sub=t('gm_flash_sub');}
  else if(pvp.busy&&last&&last.p===v&&last.full){main=t('pvp_turn',{p:pvpName(v)});sub=t('gm_full');}
  else{
    main=t('pvp_turn',{p:pvpName(v)});
    sub=heard?(last.full?t('pvp_opp_full',{p:pvpName(o),c:last.c+1}):t('pvp_heard',{p:pvpName(o),c:last.c+1})):t('pvp_intro',{k:K});
  }
  $('g-main').textContent=main;$('g-sub').textContent=sub;
  $('g-match').disabled=!canPlay||pvp.matches[v]<1||pvp.flash;
  const ov=$('g-pass');ov.hidden=!hide;
  if(hide){$('g-pass-title').textContent=t('pvp_pass',{p:pvpName(v)});$('g-pass-sub').textContent=t('pvp_dont_peek',{p:pvpName(v)});$('g-pass-go').textContent=t('pvp_ready',{p:pvpName(v)});}
}

/* ---------- Profil ---------- */
function handicap(){
  /* Som i golf teller bare runder på 9 eller 18 hull. */
  const rs=store.rounds.filter(r=>r.holes>=9).slice(-10);if(rs.length<3) return null;
  return rs.reduce((s,r)=>s+(r.strokes-r.par)*18/r.holes,0)/rs.length;
}
/* ---------- Stjerner og nivåer ----------
   ⭐ = hullet klart, ⭐⭐ = på par, ⭐⭐⭐ = under par. I dueller: +1 ⭐ for hvert hull du vinner. */
function starsFor(d,win){if(!win) return 0;return d<0?3:d===0?2:1;}
/* Eldre runder mangler «wins»; da regnes et hull som klart hvis det ikke fikk tapsscore. */
function holeWon(r,i){if(r.wins&&r.wins[i]!=null) return r.wins[i];return r.scores[i]-r.pars[i]<4;}
function duelHoleStars(scores,oppScores,n){let b=0;if(!oppScores) return 0;for(let i=0;i<n;i++) if(scores[i]!=null&&oppScores[i]!=null&&scores[i]<oppScores[i]) b++;return b;}
function roundStars(r){let p=0;for(let i=0;i<r.scores.length;i++) if(r.scores[i]!=null) p+=starsFor(r.scores[i]-r.pars[i],holeWon(r,i));return p+duelHoleStars(r.scores,r.oppScores,r.scores.length);}
const LEVELS=[0,50,150,400,1000,2500];
function pointsSummary(){
  let total=0,holes=0,dw=0,dl=0,dt=0;
  Object.values(store.daily).forEach(r=>{holes++;total+=starsFor(r.score-r.par,r.win);});
  store.rounds.forEach(r=>{
    if(r.scores&&r.pars){holes+=r.scores.length;total+=roundStars(r);}
    else holes+=r.holes;
    if(r.ms){if(r.ms.up>0) dw++;else if(r.ms.up<0) dl++;else dt++;}
  });
  let lvl=0;for(let i=0;i<LEVELS.length;i++) if(total>=LEVELS[i]) lvl=i;
  return {total,holes,dw,dl,dt,lvl};
}
function renderPoints(){
  const p=pointsSummary();
  $('p-pts').textContent=p.total.toLocaleString(locale());
  $('p-lvl').textContent=t('lvl'+p.lvl);
  const next=LEVELS[p.lvl+1];
  if(next!=null){
    $('p-next').textContent=t('next_level',{n:next-p.total,lvl:t('lvl'+(p.lvl+1))});
    $('p-bar').style.width=Math.round((p.total-LEVELS[p.lvl])/(next-LEVELS[p.lvl])*100)+'%';
  }else{$('p-next').textContent=t('max_level');$('p-bar').style.width='100%';}
  $('p-duels').textContent=t('duel_record',{w:p.dw,t:p.dt,l:p.dl});
  $('p-holes').textContent=p.holes;
}

/* ---------- Vennetabell ----------
   Fylles fra utfordringer du tar imot (koden inneholder vennens stjerner) og duellresultater.
   Når innlogging og server kommer, erstattes dette av en global toppliste (se loadGlobalLeaderboard). */
function recordFriend(name,stars,ms){
  if(!name) return;
  store.friends=store.friends||{};
  const key=name.trim().toLowerCase();if(!key) return;
  const f=store.friends[key]||{name:name.trim(),stars:null,w:0,l:0,t:0,seen:0};
  f.name=name.trim();f.seen=Date.now();
  if(stars!=null&&!isNaN(stars)) f.stars=stars;
  if(ms){if(ms.up>0) f.w++;else if(ms.up<0) f.l++;else f.t++;}
  store.friends[key]=f;save();
}
const loadGlobalLeaderboard=null; /* Plass for fremtidig server: async ()=>[{name,stars}] */
function levelOf(stars){let l=0;for(let i=0;i<LEVELS.length;i++) if(stars>=LEVELS[i]) l=i;return l;}
let boardScope='friends';
document.querySelectorAll('.seg3 [data-scope]').forEach(b=>b.addEventListener('click',()=>{boardScope=b.dataset.scope;renderBoard();}));
function friendRows(){
  const me={name:(store.name||'').trim()||t('sc_you'),stars:pointsSummary().total,me:true};
  const friends=Object.values(store.friends||{}).map(f=>({name:f.name,stars:f.stars,w:f.w,l:f.l,t:f.t}));
  const rows=[me,...friends].sort((a,b)=>(b.stars==null?-1:b.stars)-(a.stars==null?-1:a.stars));
  return {me,friends,rows,rank:rows.indexOf(me)+1};
}
function renderBoard(){
  document.querySelectorAll('.seg3 [data-scope]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scope===boardScope));
  $('b-friends').hidden=boardScope!=='friends';$('b-soon').hidden=boardScope==='friends';
  $('b-soon-title').textContent=t('scope_'+boardScope);
  const {me,friends,rows,rank:myRank}=friendRows();
  $('b-rank').textContent='#'+myRank;
  $('b-of').textContent=t('board_rank_of',{n:rows.length});
  $('b-me').textContent=me.stars.toLocaleString(locale())+' '+t('points').toLowerCase()+' · '+t('lvl'+levelOf(me.stars));
  $('b-empty').hidden=friends.length>0;
  let html=`<table class="board-t"><thead><tr><th>#</th><th>${esc(t('col_player'))}</th><th class="num">${esc(t('points'))}</th><th class="num">${esc(t('col_h2h'))}</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const h2h=r.me?'':`${r.w}–${r.l}${r.t?'–'+r.t:''}`;
    html+=`<tr class="${r.me?'me':''}"><td>${i+1}</td><td><span class="pn">${esc(r.name)}</span><span class="pl">${r.stars==null?'':esc(t('lvl'+levelOf(r.stars)))}</span></td><td class="num">${r.stars==null?'–':r.stars.toLocaleString(locale())}</td><td class="num">${h2h}</td></tr>`;
  });
  html+='</tbody></table>';
  $('b-table').innerHTML=html;
}

$('p-toboard').addEventListener('click',()=>{boardScope='friends';setView('board');});
function renderProfile(){
  renderPoints();
  const fr=friendRows();$('p-rank-f').textContent=t('rank_of',{r:fr.rank,n:fr.rows.length});
  const h=handicap();
  $('p-hcp').textContent=h==null?'–':fmtNum(Math.round(h*10)/10);
  const need=3-store.rounds.filter(r=>r.holes>=9).length;
  $('p-hcp-sub').textContent=h==null?(need===1?t('hcp_need1'):t('hcp_needN',{n:need})):t('hcp_desc');
  $('p-rounds').textContent=store.rounds.length;
  let best=null;store.rounds.forEach(r=>{if(!best||(r.strokes-r.par)/r.holes<(best.strokes-best.par)/best.holes) best=r;});
  $('p-best').textContent=best?fmtDiff(best.strokes-best.par):'–';
  $('p-birdies').textContent=store.rounds.reduce((s,r)=>s+(r.birdies||0),0)+Object.values(store.daily).filter(r=>r.win&&r.score<r.par).length;
  $('p-name').value=store.name||'';
  const hist=$('p-hist');
  if(!store.rounds.length){hist.innerHTML=`<p class="muted">${esc(t('no_rounds'))}</p>`;return;}
  hist.innerHTML=store.rounds.slice(-6).reverse().map(r=>{
    const date=new Date(r.t).toLocaleDateString(locale(),{day:'numeric',month:'short'});
    const what=(r.kind==='week'?t('week_n',{w:''}).replace(/\s*·[^·]*$/,''):r.kind==='duel'?t('duel_vs',{o:r.opp||''}):t('random'))+t('lbl_holes',{n:r.holes});
    return `<div><span>${esc(date)} · ${esc(what)}</span><b>${r.strokes} (${fmtDiff(r.strokes-r.par)})</b></div>`;
  }).join('');
}

function copy(txt,btn,fb,ok){
  const fallback=()=>{fb.hidden=false;fb.value=txt;fb.focus();fb.select();btn.textContent=t('select_copy');};
  try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent=ok;fb.hidden=true;},fallback);}catch(e){fallback();}
}

function tick(){
  const now=new Date(),mid=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const s=Math.max(0,Math.floor((mid-now)/1000));
  const b=$('d-countdown').querySelector('b');
  if(b) b.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':');
}
setInterval(tick,1000);tick();

  round={kind:c.kind,holes:c.holes,seed:c.seed,opp:c.opp,idx:0,scores:(c.scores||[]).slice(),wins:(c.wins||[]).slice(),pars:[],types:[],hole:null,done:false};
  for(let i=0;i<c.holes;i++){round.types[i]=COURSE[i];round.pars[i]=typePar(COURSE[i]);}
  for(let i=0;i<round.scores.length;i++) if(round.scores[i]!=null) round.pars[i]=genHole(round.types[i],holeBase(round.seed,i)).par;
